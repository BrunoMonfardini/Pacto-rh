<app-section [padding]="'lg'" [containerSize]="'sm'">
  <app-card class="auth-card">
    <h1 class="section-title">Redefinir senha</h1>
    <p class="section-subtitle">Escolha uma nova senha para sua conta.</p>

    @if (successMessage(); as message) {
      <p class="auth-card__success">{{ message }}</p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <app-input
          label="Nova senha"
          type="password"
          placeholder="••••••••"
          formControlName="password"
          [error]="form.controls.password.touched && form.controls.password.invalid ? 'Mínimo de 8 caracteres.' : undefined"
        />
        <app-input
          label="Confirmar nova senha"
          type="password"
          placeholder="••••••••"
          formControlName="confirmPassword"
          [error]="form.controls.confirmPassword.touched && form.hasError('passwordsMismatch') ? 'As senhas não coincidem.' : undefined"
        />

        @if (errorMessage()) {
          <p class="form-error">{{ errorMessage() }}</p>
        }

        <app-button type="submit" [disabled]="loading()" [fullWidth]="true">
          {{ loading() ? 'Salvando…' : 'Redefinir senha' }}
        </app-button>
      </form>
    }

    <p class="auth-card__footer">
      <a routerLink="/auth/login">Voltar para o login</a>
    </p>
  </app-card>
</app-section>
