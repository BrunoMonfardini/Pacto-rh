<app-section [padding]="'lg'" [containerSize]="'sm'">
  <app-card class="auth-card">
    <h1 class="section-title">Recuperar senha</h1>
    <p class="section-subtitle">Enviaremos um link de redefinição para o seu e-mail.</p>

    @if (successMessage(); as message) {
      <p class="auth-card__success">{{ message }}</p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <app-input label="E-mail" type="email" placeholder="voce@email.com" formControlName="email" />

        <app-button type="submit" [disabled]="loading()" [fullWidth]="true">
          {{ loading() ? 'Enviando…' : 'Enviar link' }}
        </app-button>
      </form>
    }

    <p class="auth-card__footer">
      <a routerLink="/auth/login">Voltar para o login</a>
    </p>
  </app-card>
</app-section>
