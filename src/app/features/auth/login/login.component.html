<app-section [padding]="'lg'" [containerSize]="'sm'">
  <app-card class="auth-card">
    <h1 class="section-title">Entrar</h1>
    <p class="section-subtitle">Acesse sua conta PactoRH.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <app-input
        label="E-mail"
        type="email"
        placeholder="voce@email.com"
        formControlName="email"
        [error]="form.controls.email.touched && form.controls.email.invalid ? 'Informe um e-mail válido.' : undefined"
      />
      <app-input
        label="Senha"
        type="password"
        placeholder="••••••••"
        formControlName="password"
        [error]="form.controls.password.touched && form.controls.password.invalid ? 'Mínimo de 6 caracteres.' : undefined"
      />

      @if (errorMessage()) {
        <p class="form-error">{{ errorMessage() }}</p>
      }

      <app-button type="submit" [disabled]="loading()" [fullWidth]="true">
        {{ loading() ? 'Entrando…' : 'Entrar' }}
      </app-button>
    </form>

    <p class="auth-card__footer">
      Não tem conta? <a routerLink="/auth/register">Cadastre-se</a> ·
      <a routerLink="/auth/forgot-password">Esqueci minha senha</a>
    </p>
  </app-card>
</app-section>
