<!-- Hero: fundo em vinheta cinza com um brilho degradê azul → vermelho
     centralizado atrás do conteúdo (glow com blur + camada nítida por cima) -->
<section class="hero" id="home">

  <div class="hero__glow" aria-hidden="true">
    <div class="hero__glow-row hero__glow-row--blur">
      @for (color of glowBars; track $index) {
        <span class="hero__glow-bar" [style.background]="color"></span>
      }
    </div>
    <div class="hero__glow-row hero__glow-row--crisp">
      @for (color of glowBars; track $index) {
        <span class="hero__glow-bar" [style.background]="color"></span>
      }
    </div>
  </div>

  <div class="container hero__content" appScrollReveal>
    <img
      src="assets/images/logo-pacto-rh/logo_sem_fundo.png"
      alt="PactoRH — Treinamento e Desenvolvimento Pessoal"
      class="hero__logo"
    />

    <p class="hero__lead">
      Desenvolvimento humano e performance corporativa em um só lugar.
    </p>

    <a routerLink="/" fragment="solucoes" class="hero__scroll-cue">
      Conheça nossas soluções
      <i class="fas fa-chevron-down"></i>
    </a>
  </div>
</section>
