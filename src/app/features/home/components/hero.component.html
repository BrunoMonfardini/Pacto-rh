<!-- Hero fiel ao Figma:
     fundo cinza claro, logo PactoRH grande centralizada,
     colunas arredondadas azuis e vermelhas na base como decoração -->
<section class="hero">

  <!-- Colunas decorativas (como no Figma — azuis e vermelhas arredondadas) -->
  <div class="hero__columns" aria-hidden="true">
    <div class="hero__col hero__col--blue-800"></div>
    <div class="hero__col hero__col--blue-600"></div>
    <div class="hero__col hero__col--blue-400"></div>
    <div class="hero__col hero__col--blue-200"></div>
    <div class="hero__col hero__col--center"></div>
    <div class="hero__col hero__col--red-200"></div>
    <div class="hero__col hero__col--red-400"></div>
    <div class="hero__col hero__col--red-600"></div>
    <div class="hero__col hero__col--red-800"></div>
  </div>

  <!-- Conteúdo centralizado por cima das colunas -->
  <div class="container hero__content">

    <!-- Logo grande centralizada (já traz o wordmark + tagline embutidos na arte) -->
    <div class="hero__logo-wrap">
      <img
        src="assets/images/logo-pacto-rh/logo_sem_fundo.png"
        alt="PactoRH — Treinamento e Desenvolvimento Pessoal"
        class="hero__logo"
      />
    </div>

    <!-- Dois CTAs -->
    <div class="hero__actions">
      <a routerLink="/empresa"      class="btn btn--primary btn--lg">Para Empresas</a>
      <a routerLink="/profissional" class="btn btn--red btn--lg">Para Profissionais</a>
    </div>

  </div>
</section>
