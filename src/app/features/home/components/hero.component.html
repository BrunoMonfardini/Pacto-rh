<!-- Hero minimalista: fundo branco, muito espaço negativo, logo em destaque
     e barras decorativas discretas em azul/vermelho ecoando a marca -->
<section class="hero" id="home">

  <div class="hero__bars" aria-hidden="true">
    <span class="hero__bar hero__bar--blue-1"></span>
    <span class="hero__bar hero__bar--blue-2"></span>
    <span class="hero__bar hero__bar--neutral"></span>
    <span class="hero__bar hero__bar--red-2"></span>
    <span class="hero__bar hero__bar--red-1"></span>
  </div>

  <div class="container hero__content" appScrollReveal>
    <img
      src="assets/images/logo-pacto-rh/logo_sem_fundo.png"
      alt="PactoRH — Treinamento e Desenvolvimento Pessoal"
      class="hero__logo"
    />

    <p class="hero__lead">
      Desenvolvimento humano e performance corporativa em um só lugar.
    </p>

    <a routerLink="/" fragment="solucoes" class="hero__scroll-cue">
      Conheça nossas soluções
      <i class="fas fa-chevron-down"></i>
    </a>
  </div>
</section>
