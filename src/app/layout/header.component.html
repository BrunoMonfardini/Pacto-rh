<!-- Navbar fixa, minimalista: logo à esquerda | nav central | hamburger à direita -->
<header class="header">
  <div class="container header__inner">

    <a routerLink="/" fragment="home" class="header__logo" (click)="closeMobile()">
      <img src="assets/images/logo-pacto-rh/logo_sem_fundo.png"
           alt="PactoRH"
           class="header__logo-img" />
    </a>

    <nav class="header__nav">
      @for (item of navItems; track item.label) {
        <a
          [routerLink]="item.route"
          [fragment]="item.fragment"
          class="nav-link"
        >{{ item.label }}</a>
      }
    </nav>

    <button
      type="button"
      class="header__hamburger"
      (click)="toggleMobile()"
      [attr.aria-expanded]="isMobileOpen()"
      aria-label="Menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>

  <nav class="mobile-menu" [class.mobile-menu--open]="isMobileOpen()">
    <div class="container">
      @for (item of navItems; track item.label) {
        <a
          [routerLink]="item.route"
          [fragment]="item.fragment"
          class="mobile-menu__link"
          (click)="closeMobile()"
        >{{ item.label }}</a>
      }
    </div>
  </nav>
</header>
